<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">AI for Hardware Design and EDA research landscape</title>
  <desc id="desc">A connected map from specifications to RTL, verification, physical design, analog circuits, PCB design, and tool-using engineering agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111b38"/>
      <stop offset="1" stop-color="#142c3c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000814" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="230" cy="160" r="235" fill="url(#glow)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="68" fill="#a78bfa" font-size="15" font-weight="700" letter-spacing="3">RESEARCH LANDSCAPE</text>
    <text x="72" y="123" fill="#f8fafc" font-size="36" font-weight="760">AI for Hardware Design &amp; EDA</text>
    <text x="72" y="162" fill="#cbd5e1" font-size="19">Benchmarks · Methods · Evaluation practices</text>
    <text x="72" y="215" fill="#94a3b8" font-size="14">TASK</text>
    <text x="151" y="215" fill="#e2e8f0" font-size="14">What must the system do?</text>
    <text x="72" y="240" fill="#94a3b8" font-size="14">ACCESS</text>
    <text x="151" y="240" fill="#e2e8f0" font-size="14">What can it see and use?</text>
    <text x="72" y="265" fill="#94a3b8" font-size="14">EVIDENCE</text>
    <text x="151" y="265" fill="#e2e8f0" font-size="14">What independently proves success?</text>

    <g transform="translate(72 278)" font-size="11" font-weight="650">
      <rect width="112" height="34" rx="17" fill="#2563eb" fill-opacity="0.22" stroke="#60a5fa" stroke-opacity="0.75"/>
      <text x="56" y="22" fill="#dbeafe" text-anchor="middle">Digital design</text>
      <rect x="126" width="118" height="34" rx="17" fill="#0f766e" fill-opacity="0.24" stroke="#5eead4" stroke-opacity="0.72"/>
      <text x="185" y="22" fill="#ccfbf1" text-anchor="middle">Circuit &amp; PCB</text>
      <rect x="258" width="142" height="34" rx="17" fill="#7c3aed" fill-opacity="0.24" stroke="#c4b5fd" stroke-opacity="0.72"/>
      <text x="329" y="22" fill="#ede9fe" text-anchor="middle">Tool-using agents</text>
    </g>
  </g>

  <g transform="translate(836 34)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">
    <path d="M94 40H220M64 65v56M250 65v56M94 146h126M157 171v52" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 6"/>
    <circle cx="157" cy="40" r="7" fill="#a78bfa"/>
    <rect x="8" y="0" width="142" height="40" rx="12" fill="#1e3a8a" stroke="#60a5fa"/>
    <text x="79" y="25" fill="#dbeafe" text-anchor="middle">RTL &amp; HLS</text>
    <rect x="164" y="0" width="142" height="40" rx="12" fill="#1e3a8a" stroke="#60a5fa"/>
    <text x="235" y="25" fill="#dbeafe" text-anchor="middle">Verification</text>
    <rect x="8" y="121" width="142" height="40" rx="12" fill="#134e4a" stroke="#5eead4"/>
    <text x="79" y="146" fill="#ccfbf1" text-anchor="middle">Analog &amp; SPICE</text>
    <rect x="164" y="121" width="142" height="40" rx="12" fill="#134e4a" stroke="#5eead4"/>
    <text x="235" y="146" fill="#ccfbf1" text-anchor="middle">Schematic &amp; PCB</text>
    <rect x="86" y="222" width="142" height="40" rx="12" fill="#4c1d95" stroke="#c4b5fd"/>
    <text x="157" y="247" fill="#ede9fe" text-anchor="middle">Engineering agents</text>
  </g>
</svg>
