name: Validate research repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate catalog schema and values
        run: python3 scripts/validate_catalog.py
      - name: Validate documentation structure and local assets
        run: python3 scripts/validate_repository.py
